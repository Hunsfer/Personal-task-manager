# Настройки обезличивания. Оба списка можно дополнять без изменения кода.
# Падежные формы перечислять не нужно. Буква «ё» считается равной «е».
#
# Здесь общий список. Свои слова отмечайте в боте кнопкой «Это не имя»: они хранятся в базе.

# Слова, которые не заменяются, хотя похожи на названия организаций или имена.
# Термины из scope.yaml не заменяются автоматически, повторять их здесь не нужно.
allow:
  - Telegram
  - Телеграм
  - Jira
  - Atlassian
  - Confluence
  - GitHub
  - GitLab
  - Git
  - Docker
  - Figma
  - Slack
  - Google
  - Chrome
  - Хром
  - Safari
  - Firefox
  - React
  - Vue
  - Angular
  - TypeScript
  - JavaScript
  - HTML
  - CSS
  - API
  - PR
  - MR
  - Postman
  - Скорее
  - Иду
  - пол
  - Пререлиз
  - кука
  - куки
  - бек
  - бэк
  - БД
  - EN
  - RU
  - Brief
  - Баги
  - Эм

# Имена, которые нужно заменять, даже если их не находит автоматика.
# Например, редкие уменьшительные формы, написанные строчными.
names: []
