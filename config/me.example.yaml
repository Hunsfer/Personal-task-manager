# Личные настройки обезличивания. Скопируйте в me.yaml: этот файл не попадает в git.
# Падежные формы и регистр букв перечислять не нужно.

# Как вас называют в чатах. Эти слова заменяются на <ME>.
# ID и @username определяются автоматически.
names:
  - Имя

# Организации, которые нужно заменять всегда. Все написания получают один плейсхолдер <ORG_n>.
organizations:
  - name: Название компании
    aliases:
      - Название по-английски
      - Как её называют в чатах

# Написания, которые относятся к одному человеку: один <PERSON_n> на всех.
# Нужно, если автоматика считает их разными людьми. Полные и уменьшительные формы
# распространённых имён («Дмитрий» и «Дима») объединяются сами, если человек есть в чатах.
same_people:
  - ["@username", "Как его зовут в чатах"]

# Логины и пароли, которые встречаются в чатах и которые нужно скрывать всегда.
# Заменяются на <SECRET> как отдельные слова, значение в карту замен не попадает.
# Распространённые формы вроде "пароль: значение" находятся и без этого списка.
secrets:
  - логин-или-пароль
