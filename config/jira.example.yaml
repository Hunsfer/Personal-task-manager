# Настройки проекта в Jira. Скопируйте в jira.yaml: реальный файл в git не попадает.

project_key: PROJ
# Точно как в Jira. Посмотреть можно в окне создания задачи.
issue_type: Задача
# Задачи в этих статусах не меняются никак. Названия точно как в Jira.
locked_statuses:
  - Тестирование
  - Готово
# Запрос на изменение к задаче в этих статусах применяется сам, без кнопки. Исключение: в запросе
# есть плейсхолдеры или файлы, ведь настоящие значения и файлы вы должны увидеть до отправки.
auto_append_statuses:
  - Новая
link_type: Relates
# Необязательно: как называются приоритеты в Jira. Без этого приоритет не передаётся.
priorities:
  high: High
  medium: Medium
  low: Low
